<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>INA BASEBALL | 試合を、次の一勝へ。</title>
  <link rel="stylesheet" href="./style.css">
  <style>#startup{max-width:560px;margin:15vh auto;padding:28px;font-family:sans-serif;line-height:1.8;color:#194d3c}#startup button{padding:12px 18px;cursor:pointer}#startup-detail{overflow-wrap:anywhere}</style>
</head>
<body>
  <div id="startup" role="status"><h1>INA BASEBALL</h1><p id="startup-message">アプリを読み込んでいます…</p><p id="startup-detail"></p><button id="startup-retry" hidden>もう一度読み込む</button></div>
  <noscript>このアプリを利用するにはJavaScriptを有効にしてください。</noscript>
  <div id="app"></div>
  <script>
    (() => {
      const status = document.getElementById('startup');
      let timer;
      window.showStartupError = detail => {
        if (document.getElementById('app').children.length) return;
        clearTimeout(timer);
        document.getElementById('startup-message').textContent = 'アプリを起動できませんでした。';
        document.getElementById('startup-detail').textContent = detail;
        document.getElementById('startup-retry').hidden = false;
      };
      document.getElementById('startup-retry').onclick = () => {
        const url = new URL(location.href);
        url.searchParams.set('reload', Date.now());
        location.replace(url.href);
      };
      window.addEventListener('error', event => {
        window.showStartupError(event.message || 'ファイルの読み込みに失敗しました。公開設定と通信状態を確認してください。');
      }, true);
      new MutationObserver(() => {
        if (document.getElementById('app').children.length) {
          status.hidden = true;
          clearTimeout(timer);
        }
      }).observe(document.getElementById('app'), {childList:true});
      timer = setTimeout(() => window.showStartupError('読み込みが完了しません。GitHubのActionsでデプロイが成功しているか確認してください。'), 12000);
    })();
  </script>
  <script type="module" src="./src.js"></script>
</body>
</html>
